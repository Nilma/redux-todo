<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Redux Toolkit CDN – Todo</title>
  <link rel="stylesheet" href="./todo.css" />

  <!-- For best results, open via a local web server (not file://) -->
  <script async src="https://ga.jspm.io/npm:es-module-shims@1.10.0/dist/es-module-shims.js"></script>
  <script type="importmap-shim">
{
  "imports": {
    "@reduxjs/toolkit": "https://esm.sh/@reduxjs/toolkit@2.11.2",
    "redux": "https://esm.sh/redux@5.0.1"
  }
}
  </script>
</head>
<body>
  <div class="container">
    <h1>Todo List</h1>
    <form id="form">
      <input id="input" placeholder="Add todo..." />
      <button type="submit">Add</button>
    </form>
    <ul id="list"></ul>
    <p class="hint">Tip: Try to save the data for the next session using localStorage.</p>
  </div>

  <script type="module-shim" src="./todo.js"></script>
</body>
</html>
